<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мнемо переехало</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14122B; color: #ECEAF7;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { color: #A993FF; }
</style>
</head>
<body>
<div><div style="font-size:56px">🚚</div><h2>Мнемо переехало</h2><p>Переношу ваш прогресс на новый адрес…</p>
<p><a id="go" href="https://kartaviys.github.io/-/mnemo/">Открыть новый адрес</a></p></div>
<script>
/* Страница для СТАРОГО адреса kartaviyukr.github.io/-/mnemo/ (см. README).
 * Прогресс хранится в памяти браузера отдельно для каждого адреса, поэтому новый адрес его не видит.
 * Эта страница открывается на старом адресе, читает прогресс с телефона и передаёт его новому адресу в ссылке после «#»
 * (часть после «#» на сервер не уходит). Новый адрес принимает данные страницей move.html. */
(async function () {
  var NEW = 'https://kartaviys.github.io/-/mnemo/';
  var go = function (url) { location.replace(url); };
  var db = null, photos = null;
  try { db = localStorage.getItem('mnemo.v1'); photos = localStorage.getItem('mnemo.photos2'); } catch (e) {}
  // Старый service worker больше не нужен: пусть старая иконка всегда берёт эту страницу из сети.
  try { (await navigator.serviceWorker.getRegistrations()).forEach(function (r) { r.unregister(); }); } catch (e) {}
  if (!db) return go(NEW);
  if (localStorage.getItem('mnemo.moved')) {
    // Уже переносили: даём пару секунд, чтобы открыть проверку (у иконки на iPhone своя память, Safari её не видит).
    document.querySelector('p').innerHTML = 'Прогресс уже перенесён. Открываю новый адрес…<br><a href="check.html" id="chk">Что-то не перенеслось? Проверить</a>';
    var t = setTimeout(function () { go(NEW); }, 2500);
    document.getElementById('chk').onclick = function () { clearTimeout(t); };
    return;
  }
  var json = '{"db":' + db + ',"photos":' + (photos || 'null') + '}';
  var bytes = new TextEncoder().encode(json), tag = 'j';
  try {
    bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    tag = 'z';
  } catch (e) {}
  var bin = '';
  for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  var b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  try { localStorage.setItem('mnemo.moved', '1'); } catch (e) {} // второй раз данные не шлём — сразу на новый адрес
  go(NEW + 'move.html#' + tag + b64);
})();
</script>
</body>
</html>
